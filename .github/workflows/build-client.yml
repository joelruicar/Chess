name: Build Chess client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: chess-windows
          - os: ubuntu-latest
            artifact: chess-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build-requirements.txt

      - name: Build executable
        run: pyinstaller --clean Chess.spec

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Chess.exe -DestinationPath Chess-Windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czf Chess-Linux.tar.gz -C dist Chess

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Chess-Windows.zip
            Chess-Linux.tar.gz
